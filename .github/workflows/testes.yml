# Integracao continua - extensao opcional do edital.
#
# Roda numa maquina limpa: sem .env, sem Redis, sem nada do ambiente de quem
# escreveu o codigo. Se a suite depende de algo que so existe no meu laptop,
# ela quebra aqui - e nao na hora da correcao.
name: testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  suite:
    name: suite de testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Rodar a suite
        run: python -m pytest testes -q

  imagens:
    name: as cinco imagens compilam
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # O compose valida os cinco Dockerfiles de uma vez. Falha aqui significa
      # que o deploy falharia depois - e melhor descobrir no push.
      - name: Montar as imagens
        run: |
          cp .env.example .env
          docker compose build

  conformidade:
    name: nada de segredo no repositorio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Chave de provedor e chave de provedor em qualquer lugar - inclusive
      # num teste. Esta varredura nao abre excecao para ninguem.
      - name: Nenhuma chave de API no repositorio
        run: |
          if grep -rnE "(sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16})"              --include="*.py" --include="*.yml" --include="*.yaml"              --include="*.md" --include="*.txt" . ; then
            echo "::error::chave de API no repositorio"
            exit 1
          fi
          echo "nenhuma chave de API"

      # Ja segredo de assinatura embutido so e problema no codigo que RODA.
      # Em testes/ o valor falso e proposital: e o que permite verificar que um
      # token assinado com outro segredo e recusado.
      - name: Nenhum segredo de assinatura fixo no codigo de producao
        run: |
          if grep -rnE "(JWT_SEGREDO|SEGREDO) *= *[\"'][^\"']{8,}"              --include="*.py" --include="*.yml" --include="*.yaml"              --exclude-dir=testes . ; then
            echo "::error::segredo de assinatura embutido no codigo de producao"
            exit 1
          fi
          echo "nenhum segredo embutido no codigo de producao"

      - name: O .env nao pode estar versionado
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env versionado"
            exit 1
          fi
          echo ".env fora do repositorio"
